name: Quality

env:
  DJANGO_SECRET_KEY: ci-solo-pruebas-clave-sintetica
  DJANGO_DB_PATH: ':memory:'

on:
  push:
  pull_request:

jobs:
  quality:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development tools
        run: python -m pip install -e ".[dev,web]"

      - name: Check code with Ruff
        run: ruff check .

      - name: Run tests with coverage
        run: coverage run -m unittest discover -s tests -v

      - name: Check Django configuration
        run: python web/manage.py check

      - name: Check Django deployment settings
        env:
          DJANGO_DEBUG: '0'
          DJANGO_ALLOWED_HOSTS: example.test
          DJANGO_SECRET_KEY: ci-deploy-synthetic-key-5b62e2e44c7848b0abfa0097815629a9
        run: python web/manage.py check --deploy

      - name: Check Django demo settings
        env:
          DJANGO_DEBUG: '0'
          DJANGO_DEMO_MODE: '1'
          DJANGO_ALLOWED_HOSTS: example.test
          DJANGO_SECRET_KEY: ci-demo-synthetic-key-3ad3b595932d46a1a0f4f44f58b6c081
        run: python web/manage.py check --deploy

      - name: Check Django migrations
        run: python web/manage.py makemigrations --check --dry-run

      - name: Collect local static resources
        env:
          DJANGO_DEBUG: '0'
          DJANGO_ALLOWED_HOSTS: example.test
          DJANGO_SECRET_KEY: ci-static-synthetic-key-2821a9adbe154bc5a883bfeaf4
          DJANGO_STATIC_ROOT: ${{ runner.temp }}/automatizador-static
        run: python web/manage.py collectstatic --noinput

      - name: Show coverage summary
        run: coverage report -m

      - name: Create coverage report
        if: matrix.os == 'ubuntu-latest'
        run: coverage xml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          use_oidc: false
