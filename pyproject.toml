[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "automatizador-comprobantes-iva"
version = "0.1.1"
description = "Herramienta en Python y pandas para validar comprobantes contables y generar informes de IVA en Excel."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Gabriel Santinelli" }]
keywords = ["contabilidad", "IVA", "ARCA", "Holistor", "Excel", "conciliacion"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Financial :: Accounting",
]
urls = { Homepage = "https://github.com/SantinelliGabriel/automatizador-reportes", Repository = "https://github.com/SantinelliGabriel/automatizador-reportes", Issues = "https://github.com/SantinelliGabriel/automatizador-reportes/issues", Changelog = "https://github.com/SantinelliGabriel/automatizador-reportes/blob/main/CHANGELOG.md" }
dependencies = [
  "pandas==3.0.6",
  "openpyxl==3.1.5",
  "streamlit>=1.66,<2",
  "xlrd>=2,<3",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.6,<8",
  "ruff>=0.14,<1",
]

[project.scripts]
automatizador = "automatizador.cli:main"
automatizador-demo = "automatizador.generar_datos_demo:main"

[tool.setuptools]
packages = ["automatizador", "ejemplos"]

[tool.setuptools.package-data]
ejemplos = ["*.xlsx", "*.csv"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
