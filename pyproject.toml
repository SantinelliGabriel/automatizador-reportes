[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "automatizador-comprobantes-iva"
version = "0.1.0"
description = "Herramienta en Python y pandas para validar comprobantes contables y generar informes de IVA en Excel."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Gabriel Santinelli" }]
dependencies = [
  "pandas==3.0.6",
  "openpyxl==3.1.5",
  "streamlit>=1.66,<2",
  "xlrd>=2,<3",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.6,<8",
  "ruff>=0.14,<1",
]

[project.scripts]
automatizador = "automatizador.cli:main"
automatizador-demo = "automatizador.generar_datos_demo:main"

[tool.setuptools]
packages = ["automatizador", "ejemplos"]

[tool.setuptools.package-data]
ejemplos = ["*.xlsx", "*.csv"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
