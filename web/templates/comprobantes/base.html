<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automatizador de comprobantes</title></head>
<body>
<header><strong>Automatizador de comprobantes</strong>
{% if user.is_authenticated %}
<nav><a href="{% url 'clientes' %}">Clientes</a>
<a href="{% url 'historial' %}">Historial</a> <a href="{% url 'observaciones' %}">Observaciones</a>
{% if user.is_staff and not DEMO_MODE %}<a href="{% url 'cargar' %}">Subir archivo</a>{% endif %}
<form action="{% url 'logout' %}" method="post">{% csrf_token %}<button type="submit">Salir</button></form>
</nav>{% endif %}</header>
<main>
{% for mensaje in messages %}<p role="status">{{ mensaje }}</p>{% endfor %}
{% block contenido %}{% endblock %}
</main>
</body></html>
